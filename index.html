<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Sổ Tay Từ Vựng Tiếng Hàn</title>
  </head>
  <body>
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="loginOverlay" class="login-overlay">
      <div class="login-box">
        <h2>🔐 Nhập mật khẩu</h2>
        <input
          type="password"
          id="passwordInput"
          placeholder="Mật khẩu của bạn là gì?"
        />
        <button
          id="btnLogin"
          class="primary-btn"
          style="width: 100%; margin-top: 16px"
        >
          Mở Khóa Sổ Tay
        </button>
        <p
          id="loginError"
          style="
            color: #ef4444;
            margin-top: 8px;
            font-size: 14px;
            display: none;
          "
        >
          Mật khẩu không đúng. Thử lại nhé!
        </p>
      </div>
    </div>

    <div class="overlay" id="mobileOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="logo">🇰🇷 Vocab Note</div>
      <div class="input-group" style="margin-bottom: 16px">
        <input
          type="text"
          id="newTopicInput"
          placeholder="Thêm chủ đề mới..."
        />
        <button
          class="primary-btn"
          id="btnAddTopic"
          style="margin-top: 8px; width: 100%"
        >
          + Thêm
        </button>
      </div>

      <ul class="topic-list" id="topicList"></ul>

      <div class="sidebar-tools">
        <button
          class="tool-btn"
          id="btnStartTest"
          style="
            background-color: var(--primary-hover);
            color: white;
            border: none;
            margin-bottom: 12px;
          "
        >
          📝 Bắt đầu kiểm tra
        </button>

        <input
          type="file"
          id="excelInput"
          accept=".xlsx, .xls"
          style="display: none"
        />
        <button class="tool-btn" id="btnImportExcel">📥 Nhập Excel</button>
        <button class="tool-btn" id="btnExportExcel">📤 Xuất Excel</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="header-actions">
        <button class="menu-toggle" id="btnToggleMenu">☰</button>
        <h1 id="currentTopicTitle">Đang tải dữ liệu...</h1>
      </div>

      <!-- FORM THÊM TỪ -->
      <div class="add-word-form" id="addWordForm">
        <div class="input-group">
          <label>Từ tiếng Hàn</label>
          <input type="text" id="wordInput" placeholder="VD: 학교" />
        </div>
        <div class="input-group">
          <label>Loại từ</label>
          <select id="typeInput">
            <option value="Danh từ">Danh từ</option>
            <option value="Động từ">Động từ</option>
            <option value="Tính từ">Tính từ</option>
            <option value="Phó từ">Phó từ</option>
            <option value="Trợ từ">Trợ từ</option>
            <option value="Cụm từ">Cụm từ</option>
          </select>
        </div>
        <div class="input-group">
          <label>Nghĩa tiếng Việt</label>
          <input type="text" id="meaningInput" placeholder="VD: Trường học" />
        </div>
        <button class="primary-btn" id="btnAddWord">Lưu Từ Vựng</button>
      </div>

      <!-- LƯỚI TỪ VỰNG -->
      <div class="vocab-grid" id="vocabGrid"></div>

      <!-- KHU VỰC KIỂM TRA -->
      <div class="test-screen" id="testScreen">
        <div class="test-card">
          <h2
            id="testTopicName"
            style="color: var(--primary-color); margin-bottom: 8px"
          >
            Kiểm tra
          </h2>
          <p
            id="testProgress"
            style="color: var(--text-muted); margin-bottom: 24px"
          >
            Từ 1/10
          </p>

          <div
            id="testQuestion"
            class="word-kr"
            style="
              justify-content: center;
              margin-bottom: 4px;
              font-size: 36px;
              padding-right: 0;
            "
          >
            학교
          </div>
          <div id="testWordType" class="word-type" style="margin-bottom: 24px">
            (Danh từ)
          </div>

          <input
            type="text"
            id="testAnswerInput"
            placeholder="Nhập nghĩa tiếng Việt..."
          />
          <p
            id="testFeedback"
            style="margin-bottom: 16px; font-weight: bold; min-height: 24px"
          ></p>

          <button
            class="primary-btn"
            id="btnSubmitAnswer"
            style="width: 100%; margin-bottom: 12px"
          >
            Kiểm tra
          </button>
          <button
            class="tool-btn"
            id="btnEndTest"
            style="width: 100%; border: none"
          >
            Dừng kiểm tra & Quay lại
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
